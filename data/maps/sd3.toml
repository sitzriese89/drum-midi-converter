# Toontrack Superior Drummer 3 drum map — default "GM Extended" mapping.
# Source: UNOFFICIAL, compiled from https://drumverter.com/engines/superior-drummer3/
# (Toontrack's official MIDI layouts are behind a login; see
# data/research/vendor-maps.md §4 for the official structural statements).
# Tags follow docs/tag-taxonomy.md. SD3 triggers many articulations on several
# notes; duplicates get numeric suffixes in ascending note order, with the
# primary on the GM-style position.

id = "sd3"
name = "Superior Drummer 3"
vendor = "Toontrack"
description = "Superior Drummer 3 default 'GM Extended' mapping (SD2-compatible). Deep hi-hat ladder (tight/loose/closed/open 1-5, tip/edge/bell) and many duplicate trigger notes across snare, kick, hats and cymbals. Officially GM Extended; GM notes 36/37/38/42/44/46 and toms 41-48 are honored."

