to = "hihat.closed.tip"

[[fallback.rules]]
from = "hihat.closed.edge.2"
to = "hihat.closed.edge"

[[fallback.rules]]
from = "hihat.open.4.tip"
to = "hihat.open.3.tip"

[[fallback.rules]]
