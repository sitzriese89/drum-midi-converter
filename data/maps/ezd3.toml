# Documented fallback rules (SPEC §3.3): fold duplicate triggers to the
# primary notes and collapse the deep hat ladder and cross-family cymbals
# when converting FROM EZdrummer 3. Mutes are handled by the parent-walk.
[fallback]

[[fallback.rules]]
from = "kick.2"
to = "kick.1"

[[fallback.rules]]
from = "kick.3"
to = "kick.1"

[[fallback.rules]]
from = "snare.center.2"
to = "snare.center"

[[fallback.rules]]
from = "snare.ruff"
to = "snare.center"

[[fallback.rules]]
from = "hihat.pedal.2"
to = "hihat.pedal"

[[fallback.rules]]
from = "hihat.pedal.3"
to = "hihat.pedal"

[[fallback.rules]]
from = "hihat.closed.tip.2"
to = "hihat.closed.tip"

[[fallback.rules]]
