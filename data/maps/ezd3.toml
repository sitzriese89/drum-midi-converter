# Toontrack EZdrummer 3 drum map — default "GM Extended" mapping.
# Source: UNOFFICIAL, compiled from https://drumverter.com/engines/ezdrummer/
# plus the low-register hi-hat subset read from the official Toontrack CDN
# chart image (https://cdn.toontrack.com/app/uploads/png/ezd3_midimapping_304.png).
# The low-register hat notes come from an UNOFFICIAL reading of that official
# image; the two sources agree where they overlap (notes 21-26, 42, 44, 46,
# 61-65). See data/research/vendor-maps.md §5.
# Tags follow docs/tag-taxonomy.md.

id = "ezd3"
name = "EZdrummer 3"
vendor = "Toontrack"
description = "EZdrummer 3 default 'GM Extended' mapping. Shares most GM notes with SD3 but places Ride Edge on 52 (no china in the standard map) and Splash on 55. Low-register hat notes come from an unofficial reading of the official Toontrack chart image."

