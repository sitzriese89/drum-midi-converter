# Tags follow docs/tag-taxonomy.md. Note the vendor's unusual tom naming:
# "Floor Tom 1..4" and "Rack Tom 1/2" at 38/37 — tom tags are ranked by the
# vendor's own numbering, not by note order.

id = "rs-drums-fairview"
