# Documented fallback rules (SPEC §3.3): when converting FROM the GM map,
# collapse cymbal variants that other maps commonly lack.
[fallback]
[[fallback.rules]]
from = "crash.chinese"
to = "crash.1"

[[fallback.rules]]
from = "crash.splash"
to = "crash.1"

[[fallback.rules]]
from = "ride.bell"
to = "ride.1"

[[fallback.rules]]
from = "ride.2"
to = "ride.1"

[[fallback.rules]]
from = "crash.2"
to = "crash.1"

[[fallback.rules]]
from = "hihat.pedal"
to = "hihat.closed"

# GM pitched toms / generic names collapse into the canonical taxonomy when
# the target map uses ranked or tip/edge-split tags (rules only fire when no
# exact match exists in the target).
[[fallback.rules]]
from = "tom.high"
to = "tom.rack.1"

[[fallback.rules]]
from = "tom.mid-high"
to = "tom.rack.2"

[[fallback.rules]]
from = "tom.mid-low"
to = "tom.rack.3"

[[fallback.rules]]
from = "tom.low"
to = "tom.floor.1"

[[fallback.rules]]
from = "tom.floor.high"
to = "tom.floor.1"

[[fallback.rules]]
from = "tom.floor.low"
to = "tom.floor.2"

[[fallback.rules]]
from = "snare.electric"
to = "snare.center"

[[fallback.rules]]
from = "kick.acoustic"
to = "kick.1"

[[fallback.rules]]
from = "hihat.closed"
to = "hihat.closed.tip"

[[fallback.rules]]
from = "hihat.open"
to = "hihat.open.2"

[[fallback.rules]]
from = "hihat.open"
to = "hihat.open.2.tip"

[[fallback.rules]]
from = "crash.chinese"
to = "china.1"

[[fallback.rules]]
from = "crash.splash"
to = "splash.1"
