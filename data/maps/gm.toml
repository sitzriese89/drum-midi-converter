# General MIDI drum map (GM percussion, channel 10).
# Note numbers 35-81 per the MIDI Manufacturers Association General MIDI
# Level 1 percussion key map. Names follow the GM spec; semantic tags follow
# the ADR-001 tag vocabulary (family.qualifier[.qualifier...]).

id = "gm"
name = "General MIDI"
vendor = "MMA"
description = "General MIDI Level 1 percussion key map (notes 35-81, channel 10)."

[notes.35]
name = "Acoustic Bass Drum"
tag = "kick.acoustic"

